name: Deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: '0 */6 * * *' }]
  workflow_dispatch:
  repository_dispatch: { types: [content-updated] }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Validate content
        run: npm run validate
      # - name: Sync Google Drive / Sheets  (turn on googleDrive in site.config.mjs and add scripts/sync-drive.mjs)
      #   if: ${{ vars.SYNC_DRIVE == 'true' }}
      #   run: node scripts/sync-drive.mjs
      #   env: { GOOGLE_SERVICE_ACCOUNT: '${{ secrets.GOOGLE_SERVICE_ACCOUNT }}' }
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
