# Gives officers a form-based editor on GitHub content, even from mobile, without touching JSON.
media:
  input: content/media
  output: /media
content:
  - name: recruitment
    label: WoW Forever · Reclutamento
    type: file
    path: content/games/wow-forever/recruitment.json
    format: json
    fields:
      - { name: open, label: Reclutamento aperto, type: boolean }
      - { name: headline, label: Titolo, type: string }
      - { name: text, label: Testo, type: text }
      - { name: highlight, label: Badge in evidenza (es. Priorità DPS), type: string }
      - name: roles
        label: Ruoli
        type: object
        list: true
        fields:
          - { name: role, label: Ruolo, type: select, options: { values: [tank, healer, dps] } }
          - { name: label, label: Etichetta, type: string }
          - { name: priority, label: Priorità, type: select, options: { values: [high, open, closed] } }
          - { name: wanted, label: Quanti cerchiamo (vuoto = automatico), type: number }
      - name: targets
        label: Posti nel roster raid
        type: object
        fields:
          - { name: tank, type: number }
          - { name: healer, type: number }
          - { name: dps, type: number }
      - name: classes
        label: Classi e spec
        type: object
        list: true
        fields:
          - { name: class, label: Classe, type: select, options: { values: [warrior, paladin, hunter, rogue, priest, shaman, mage, warlock, druid] } }
          - { name: note, label: Nota, type: string }
          - name: specs
            label: Spec
            type: object
            list: true
            fields:
              - { name: name, label: Spec, type: string }
              - { name: role, label: Ruolo, type: select, options: { values: [tank, healer, dps] } }
              - { name: priority, label: Priorità, type: select, options: { values: [high, open, closed] } }
  - name: roster
    label: WoW Forever · Roster
    type: file
    path: content/games/wow-forever/roster.json
    format: json
    fields:
      - { name: updated, label: Aggiornato il, type: date }
      - name: players
        label: Giocatori
        type: object
        list: true
        fields:
          - { name: name, label: Nome, type: string }
          - { name: class, label: Classe, type: select, options: { values: [warrior, paladin, hunter, rogue, priest, shaman, mage, warlock, druid] } }
          - { name: spec, label: Spec, type: string }
          - { name: role, label: Ruolo, type: select, options: { values: [tank, healer, dps] } }
          - { name: faction, label: Gilda, type: select, options: { values: [Nebulah, Nebulaa] } }
          - { name: rank, label: Rango, type: select, options: { values: [Raider, Trial] } }
  - name: libro
    label: Lore · Il libro
    type: file
    path: content/lore/libro.json
    format: json
    fields:
      - { name: title, label: Titolo, type: string }
      - { name: author, label: Autore (vuoto = non mostrato), type: string }
      - { name: kind, label: Forma (es. Light novel), type: string }
      - { name: genre, label: Genere, type: string }
      - { name: teaser, label: Frase per la home, type: text }
      - { name: presentation, label: Presentazione (si aggiorna con npm run lore:import), type: text }
      - { name: cover, label: Copertina, type: image }
  - name: lore
    label: Lore · Capitoli
    type: collection
    path: content/lore
    filename: '{fields.numeral}-{primary}.md'
    fields:
      - { name: id, label: ID nell’indirizzo (01, 02…), type: string }
      - { name: title, label: Titolo, type: string }
      - { name: order, label: Ordine, type: number }
      - { name: numeral, label: Numero (01, 02…), type: string }
      - { name: kind, label: Tipo, type: select, options: { values: [Capitolo] } }
      - { name: cover, label: Copertina, type: image }
      - { name: minutes, label: Minuti di lettura, type: number }
      - { name: body, label: Testo (si aggiorna con npm run lore:import, le modifiche fatte qui vengono sovrascritte), type: rich-text }
  - name: fondatori
    label: Chi siamo · Fondatori e co-fondatori
    type: file
    path: content/pages/fondatori.json
    format: json
    fields:
      - { name: title, label: Titolo della sezione, type: string }
      - { name: lead, label: Introduzione, type: text }
      - name: groups
        label: Gruppi
        type: object
        list: true
        fields:
          - { name: title, label: Gruppo (es. Fondatori), type: string }
          - { name: text, label: Chi sono, type: string }
          - name: people
            label: Persone
            type: object
            list: true
            fields:
              - { name: name, label: Nome, type: string }
              - { name: role, label: Ruolo, type: string }
              - { name: line, label: Il personaggio in una riga, type: string }
              - { name: text, label: Il personaggio nella storia, type: text }
              - { name: contribution, label: Cosa ha fatto per Nebula, type: text }
              - { name: image, label: Ritratto, type: image }
              - { name: alt, label: Descrizione del ritratto, type: string }
      - name: photo
        label: Foto di gruppo
        type: object
        fields:
          - { name: src, label: Immagine, type: image }
          - { name: alt, label: Descrizione, type: string }
          - { name: caption, label: Didascalia, type: string }
